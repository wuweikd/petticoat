services:
  postgres:
    image: postgres:16-alpine
    container_name: petticoat-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: petticoat
      POSTGRES_PASSWORD: petticoat
      POSTGRES_DB: petticoat
    volumes:
      - petticoat_pg:/var/lib/postgresql/data

volumes:
  petticoat_pg:
